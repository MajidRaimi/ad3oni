[project]
name = "api"
version = "0.1.10"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "openai==1.59.6",
    "slowapi==0.1.9",
    "arq==0.28.0",
    "redis==5.2.1",
    "pynacl>=1.6.2",
    "croniter>=6.2.2",
]

[dependency-groups]
dev = [
    "ruff==0.8.6",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "types-croniter>=6.2.2.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
